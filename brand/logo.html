<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0b0616; }
      .art { position: relative; overflow: hidden; }
      #icon { width: 512px; height: 512px; }
      #banner { width: 1200px; height: 630px; margin-top: 40px; }
      svg { display: block; }
      /* Wordmark for the banner */
      .wm {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        letter-spacing: -0.03em;
      }
    </style>
  </head>
  <body>
    <!-- ============ ICON 512×512 ============ -->
    <div id="icon" class="art">
      <svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3a1566" />
            <stop offset="0.5" stop-color="#2a1150" />
            <stop offset="1" stop-color="#180a30" />
          </linearGradient>
          <radialGradient id="glow" cx="0.5" cy="0.36" r="0.65">
            <stop offset="0" stop-color="#ff5ecb" stop-opacity="0.55" />
            <stop offset="0.55" stop-color="#7c5cff" stop-opacity="0.18" />
            <stop offset="1" stop-color="#7c5cff" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="gem" x1="0.2" y1="0" x2="0.8" y2="1">
            <stop offset="0" stop-color="#ff9ae0" />
            <stop offset="0.45" stop-color="#ff4fbf" />
            <stop offset="1" stop-color="#a12fd0" />
          </linearGradient>
          <linearGradient id="gemTeal" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8bf0da" /><stop offset="1" stop-color="#16a98a" />
          </linearGradient>
          <linearGradient id="gemGold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffe08a" /><stop offset="1" stop-color="#f0a52a" />
          </linearGradient>
          <linearGradient id="gemBlue" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#9cc4ff" /><stop offset="1" stop-color="#2f6bd4" />
          </linearGradient>
          <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.25" />
            <stop offset="0.4" stop-color="#ffffff" stop-opacity="0" />
          </linearGradient>
          <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#12071f" flood-opacity="0.55" />
          </filter>
          <filter id="blur"><feGaussianBlur stdDeviation="26" /></filter>
        </defs>

        <!-- plate -->
        <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#plate)" />
        <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#glow)" />
        <!-- ambient blobs -->
        <circle cx="120" cy="150" r="90" fill="#ff5ecb" opacity="0.25" filter="url(#blur)" />
        <circle cx="410" cy="380" r="100" fill="#7c5cff" opacity="0.30" filter="url(#blur)" />

        <!-- small accent gems -->
        <g opacity="0.95">
          <rect x="86" y="330" width="70" height="70" rx="20" fill="url(#gemTeal)" transform="rotate(-12 121 365)" filter="url(#soft)" />
          <rect x="360" y="120" width="60" height="60" rx="17" fill="url(#gemGold)" transform="rotate(14 390 150)" filter="url(#soft)" />
          <rect x="372" y="352" width="52" height="52" rx="15" fill="url(#gemBlue)" transform="rotate(-10 398 378)" filter="url(#soft)" />
        </g>

        <!-- hero candy gem -->
        <g transform="rotate(-8 256 262)" filter="url(#soft)">
          <rect x="140" y="146" width="232" height="232" rx="64" fill="url(#gem)" />
          <!-- inner rim -->
          <rect x="140" y="146" width="232" height="232" rx="64" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" />
          <!-- gloss -->
          <ellipse cx="212" cy="204" rx="70" ry="40" fill="#ffffff" opacity="0.42" transform="rotate(-24 212 204)" />
          <!-- sparkle glyph -->
          <path d="M256 196 L272 246 L322 262 L272 278 L256 328 L240 278 L190 262 L240 246 Z" fill="#ffffff" opacity="0.92" />
        </g>

        <!-- floating star sparkles -->
        <g fill="#ffffff">
          <path d="M150 110 l7 20 20 7 -20 7 -7 20 -7 -20 -20 -7 20 -7 z" opacity="0.9" />
          <path d="M416 250 l5 15 15 5 -15 5 -5 15 -5 -15 -15 -5 15 -5 z" opacity="0.75" />
          <path d="M300 410 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5 z" opacity="0.7" />
        </g>

        <!-- top sheen -->
        <rect x="0" y="0" width="512" height="230" rx="120" fill="url(#sheen)" />
      </svg>
    </div>

    <!-- ============ BANNER 1200×630 ============ -->
    <div id="banner" class="art">
      <svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2a1150" /><stop offset="1" stop-color="#140a2a" />
          </linearGradient>
          <radialGradient id="bglow" cx="0.32" cy="0.4" r="0.6">
            <stop offset="0" stop-color="#ff5ecb" stop-opacity="0.4" />
            <stop offset="1" stop-color="#7c5cff" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="wmgrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ffffff" /><stop offset="0.6" stop-color="#ffd3f2" />
          </linearGradient>
          <linearGradient id="tongrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ff5ecb" /><stop offset="1" stop-color="#7c5cff" />
          </linearGradient>
          <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3a1566" /><stop offset="0.5" stop-color="#2a1150" /><stop offset="1" stop-color="#180a30" />
          </linearGradient>
          <radialGradient id="glow" cx="0.5" cy="0.36" r="0.65">
            <stop offset="0" stop-color="#ff5ecb" stop-opacity="0.55" /><stop offset="0.55" stop-color="#7c5cff" stop-opacity="0.18" /><stop offset="1" stop-color="#7c5cff" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="gem" x1="0.2" y1="0" x2="0.8" y2="1">
            <stop offset="0" stop-color="#ff9ae0" /><stop offset="0.45" stop-color="#ff4fbf" /><stop offset="1" stop-color="#a12fd0" />
          </linearGradient>
          <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#12071f" flood-opacity="0.55" />
          </filter>
          <filter id="blur"><feGaussianBlur stdDeviation="26" /></filter>
        </defs>
        <rect width="1200" height="630" fill="url(#bbg)" />
        <rect width="1200" height="630" fill="url(#bglow)" />
        <circle cx="1050" cy="120" r="150" fill="#7c5cff" opacity="0.25" filter="url(#blur)" />
        <circle cx="180" cy="540" r="130" fill="#ff5ecb" opacity="0.22" filter="url(#blur)" />

        <!-- compact logo mark on the left -->
        <g transform="translate(120 175)">
          <rect x="0" y="0" width="280" height="280" rx="72" fill="url(#plate)" />
          <rect x="0" y="0" width="280" height="280" rx="72" fill="url(#glow)" />
          <g transform="rotate(-8 140 140)" filter="url(#soft)">
            <rect x="52" y="52" width="176" height="176" rx="50" fill="url(#gem)" />
            <ellipse cx="106" cy="98" rx="52" ry="30" fill="#ffffff" opacity="0.42" transform="rotate(-24 106 98)" />
            <path d="M140 84 L152 122 L190 134 L152 146 L140 184 L128 146 L90 134 L128 122 Z" fill="#ffffff" opacity="0.92" />
          </g>
          <g fill="#ffffff">
            <path d="M40 34 l5 15 15 5 -15 5 -5 15 -5 -15 -15 -5 15 -5 z" opacity="0.85" />
            <path d="M232 150 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z" opacity="0.7" />
          </g>
        </g>

        <text class="wm" x="470" y="300" font-size="118" fill="url(#wmgrad)">Candy<tspan fill="url(#tongrad)">TON</tspan></text>
        <text x="474" y="368" font-size="34" letter-spacing="6" fill="#c8b8e8" font-family="system-ui, sans-serif" font-weight="600">MATCH · COMBO · COMPETE</text>
        <g font-family="system-ui, sans-serif">
          <rect x="474" y="404" width="150" height="46" rx="23" fill="#ff5ecb22" stroke="#ff5ecb" stroke-opacity="0.4" />
          <text x="549" y="434" font-size="22" fill="#ffb0e6" text-anchor="middle" font-weight="700">30 levels</text>
          <rect x="638" y="404" width="176" height="46" rx="23" fill="#7c5cff22" stroke="#7c5cff" stroke-opacity="0.4" />
          <text x="726" y="434" font-size="22" fill="#c3b0ff" text-anchor="middle" font-weight="700">🏆 leaderboard</text>
        </g>
      </svg>
    </div>
  </body>
</html>
